name: Synchronize content

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npx @soubiran/content infra src/app/pages
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CONTENT_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CONTENT_CF_ACCESS_CLIENT_SECRET }}
